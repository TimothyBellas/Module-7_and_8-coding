name: RAG CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            frontend/requirements.txt
      - name: Configure safe defaults
        run: cp .env.example .env
      - name: Install application and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r frontend/requirements.txt
      - name: Run tests without live models or network calls
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure safe defaults
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend and frontend images
        run: docker compose build backend frontend
      - name: Verify both images exist
        run: |
          docker image inspect containerized-rag-backend:local
          docker image inspect containerized-rag-frontend:local
