services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - "chroma_data:${CHROMA_PATH:-/app/chroma_data}"
      - "embedding_cache:/root/.cache/chroma"
      - "./backend/docs:${DOCS_PATH:-/app/docs}:ro"
    depends_on:
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_data:
  ollama_data:
  embedding_cache:
