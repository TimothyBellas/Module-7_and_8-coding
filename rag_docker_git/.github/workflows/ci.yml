name: RAG CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANONYMIZED_TELEMETRY: "False"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
            tests/requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r frontend/requirements.txt -r tests/requirements.txt

      - name: Run backend endpoint tests and the existing suite
        run: python -m pytest backend/tests tests

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the backend Docker image
        run: docker build --tag rag-backend:ci ./backend

      - name: Build the frontend Docker image
        run: docker build --tag rag-frontend:ci ./frontend

      - name: Verify both Docker images were created
        run: docker image inspect rag-backend:ci rag-frontend:ci --format '{{.Id}} {{json .RepoTags}}'
